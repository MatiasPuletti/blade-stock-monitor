name: L3 stock monitor
on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 min (UTC) — GitHub's minimum
  workflow_dispatch:
    inputs:
      debug:
        description: "Set to 1 for a debug run"
        default: "0"
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check stock
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEBUG: ${{ github.event.inputs.debug }}
        run: python monitor.py
      - name: Persist state
        run: |
          if [ -n "$(git status --porcelain state.txt)" ]; then
            git config user.name "stock-bot"
            git config user.email "bot@users.noreply.github.com"
            git add state.txt && git commit -m "update state" && git push
          fi
